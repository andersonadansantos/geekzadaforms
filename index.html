
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concursos Geekzada 2026 - Inscrições</title>
    
    <!-- Silencia o erro 404 do favicon.ico -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #020617; /* slate-950 */
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* Previne o flash de conteúdo não estilizado antes do Tailwind carregar */
        [v-cloak] { display: none; }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react/": "https://esm.sh/react@^19.2.4/",
        "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.93.1",
        "xlsx": "https://esm.sh/xlsx@^0.18.5"
      }
    }
    </script>
    
    <!-- Configuração do Tailwind para evitar avisos de JIT em alguns consoles -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: {
                950: '#020617',
              }
            }
          }
        }
      }
    </script>
</head>
<body>
    <div id="root"></div>
    
    <!-- IMPORTANTE: O script type="module" é o que faz a aplicação rodar em servidores como Hostinger -->
    <script type="module" src="./index.tsx"></script>
</body>
</html>
